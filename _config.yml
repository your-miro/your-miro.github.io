# Site configuration — custom theme, no gem theme.

title: Marwan Emira
short_name: Marwan
# Arabic tagline carried over from the previous site
tagline: رَأيْتُ القنَاعَة َ رَأْسَ الغنَى، فصِرتُ بأَذْيَالِهَا مُمْتَسِكْ
role: RF · Radar · Electromagnetics
description: >-
  Electrical Engineer specializing in RF and wireless system design,
  radar architecture, power amplifier development, PCB design,
  digital predistortion (DPD), linearization algorithms,
  and end-to-end system benchmarking for high-performance communication
  and sensing applications.

url: "https://your-miro.github.io"
baseurl: ""
lang: en
timezone: Asia/Dubai

author:
  name: Marwan Emira
  email: marwanadawy13@gmail.com
  github: your-miro
  linkedin: marwan-emira100
  avatar: /assets/img/IMG_7703.png

# Path to a résumé PDF to show a "Résumé" button in the nav and contact
# section. Left empty on purpose — set e.g. /assets/MarwanEmira_Resume__FullAE.pdf
resume:

# giscus comments (same discussion threads as before — mapped by title)
giscus:
  repo: your-miro/your-miro.github.io
  repo_id: R_kgDOQCjQlA
  category: Announcements
  category_id: DIC_kwDOQCjQlM4C-XPP

# Keep the old Chirpy URL scheme so existing links keep working
permalink: /posts/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  - scope:
      path: ""
    values:
      layout: page

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .devcontainer
  - .vscode
  - .claude
  - "assets/img/*.xcf"
  - "_posts/2026-07-06-ADES.md"
  - "_posts/2026-07-28-FDB.md"
