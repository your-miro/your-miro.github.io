# Selected work shown on the home page, in display order.
# `post` is the post's slug (matches /posts/<slug>/).
# `fit: contain` puts diagrams on a light "screen"; `cover` fills the frame (photos).
# `readouts` are the instrument-style figures shown on each card.

- post: offline-ml
  title: Offline ML-DPD Research
  kicker: Research · RF Machine Learning
  blurb: >-
    Measurement-driven neural DPD on ADRV9026 captures — BiLSTM PA surrogates,
    a spectral-output-aware ACLR loss, cross-PA transfer, input selection and pruning.
  image: /assets/img/Code.png
  fit: cover
  featured: true
  readouts:
    - { label: ACLR, value: "−28 → −44 dBc" }
    - { label: NMSE, value: "≈ −35 dB" }

- post: RF-Lineup
  title: Radio Frequency Homodyne Transmitter
  kicker: Transceiver Design · Keysight ADS
  blurb: >-
    A complete Tx line-up planned to a budget in ADS — 100 MHz IF up to the DCS-1800 band,
    Harmonic Balance analysis of spurs and LO leakage, and a custom bandpass filter.
  image: /assets/img/Lineup/Fig1.png
  fit: contain
  readouts:
    - { label: RF, value: "1.8425 GHz" }
    - { label: P_OUT, value: "12.4 dBm" }

