---
layout: default
---
<article class="wrap page-body">
  <header class="pagehead">
    <p class="eyebrow mono">// {{ page.eyebrow | default: 'PAGE' }}</p>
    <h1 class="pagehead__title">{{ page.title }}</h1>
    {%- if page.description %}<p class="pagehead__lede">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
